# Create one card per series; these can be displayed in a grid.
type: grid
columns: 2
square: false
cards:
  - type: custom:motorsport-card
    calendar_entity: calendar.externa_sensorer_lightsouts
    series: F1
    compact: true
  - type: custom:motorsport-card
    calendar_entity: calendar.externa_sensorer_lightsouts
    series: MotoGP
    compact: true
