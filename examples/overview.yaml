# One Motorsport Overview card containing all available series.
# Tap a series to expand it, then optionally open its weekend schedule.
type: custom:motorsport-card
calendar_entity: auto
view: overview
series: all
overview_layout: grid # Change to list for the vertical layout.
max_series: 12
days_ahead: 120
language: auto
